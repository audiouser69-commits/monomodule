# Builds and tests Monomodule on macOS, Linux and Windows. On a version tag (v1.2.3) it also publishes a GitHub
# release with the macOS, Linux and Windows zips attached.
name: build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,     platform: macos,   generator: Ninja, extra: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"' }
          - { os: ubuntu-24.04, platform: linux,   generator: Ninja, extra: '' }
          - { os: windows-2022, platform: windows, generator: 'Visual Studio 17 2022', extra: '-A x64' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libasound2-dev libjack-jackd2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libgl1-mesa-dev libcurl4-openssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Ninja (macOS)
        if: matrix.platform == 'macos'
        run: brew install ninja

      # MAKU (Monomodule Euclid) is GNU C: on Windows it is built with MinGW-w64 gcc beside MSVC
      - name: MinGW-w64 gcc for MAKU (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          if [ -x /c/mingw64/bin/gcc.exe ]; then
            echo "MAKU_CC=C:/mingw64/bin/gcc.exe" >> "$GITHUB_ENV"
          else
            choco install mingw -y --no-progress
            echo "MAKU_CC=C:/ProgramData/mingw64/mingw64/bin/gcc.exe" >> "$GITHUB_ENV"
          fi

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G "${{ matrix.generator }}" ${{ matrix.extra }} -DCMAKE_BUILD_TYPE=Release -DMNM_COPY_PLUGINS=OFF -DMNM_MAKU_CC="${MAKU_CC:-}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage downloads
        shell: bash
        run: cmake -DBUILD_DIR=build -DOUT_DIR=dist -DPLATFORM=${{ matrix.platform }} -P cmake/stage_release.cmake

      - uses: actions/upload-artifact@v7
        with:
          name: monomodule-${{ matrix.platform }}
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          name: Monomodule Euclid ${{ github.ref_name }}
          body: |
            Monomodule Euclid: the emulated Monomachine (six tracks), the generative Euclidean sequencer with GRID mode,
            and MAKU, the ambient generator, linked to it (shared key, CHORD, gestures, MIX page and routing).
            Download the zip for your system; the VST3 plugins are in its VST3 folder (copy the whole "Monomodule Euclid.vst3"
            folder to C:\Program Files\Common Files\VST3 on Windows). User manual (Italian): docs/Monomodule-Euclid-Manuale.pdf.
            The Monomachine OS file (Elektron_SFX6-60_OS1.32B.syx, free from Elektron) is asked for on first use.
          files: |
            dist/*-linux-*.zip
            dist/*-windows-*.zip
            dist/*-macos-*.zip
