# Monomodule Bench for Android (android/): the load test that measures how many emulated Monomachine tracks and MAKU
# a phone plays in real time. Builds a debug-signed APK (installable by hand) and keeps it as an artifact.
name: android

on:
  push:
    branches: [master, main]
    paths: ['android/**', 'src/core/**', 'ext/**', 'cmake/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Build the APK
        shell: bash
        run: set -o pipefail; gradle -p android assembleDebug 2>&1 | tee build.log
      - name: Report the errors
        if: failure()
        shell: bash
        run: |   # the first errors as annotations (readable without the logs)
          { grep -A12 "What went wrong" build.log; grep -nE "error:|CMake Error|undefined reference|fatal error" -A2 build.log; } | head -90 > errs.txt || true
          python3 - <<'PY'
          import re
          lines = open('errs.txt').read().splitlines()
          for i in range(0, len(lines), 6):
              chunk = '%0A'.join(l.replace('%', '%25')[:300] for l in lines[i:i + 6])
              print('::error::' + chunk)
          PY
      - name: Name it
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MonomoduleBench.apk
      - uses: actions/upload-artifact@v7
        with:
          name: monomodule-bench-android
          path: MonomoduleBench.apk

  # the APK as a release asset too (one tap to download on the phone): a pre-release, never "latest"
  publish:
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: monomodule-bench-android
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: android-bench
          target_commitish: ${{ github.sha }}
          name: Monomodule Bench (Android, test di carico)
          prerelease: true
          make_latest: false
          body: |
            Test di carico per Android: misura quante tracce Monomachine emulate e MAKU regge il telefono, prima del porting completo.
            Scarica MonomoduleBench.apk dal telefono, aprilo e consenti l'installazione da questa fonte. Serve Android 9 o più recente, ARM a 64 bit.
            Poi: 1) scegli il file OS della Monomachine, 2) Misura, 3) Ascolta.
          files: MonomoduleBench.apk
